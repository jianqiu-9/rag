[project]
name = "interview-rag"
version = "0.1.0"
description = "本地面经知识库：EmbeddingGemma + pgvector + DeepSeek"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "numpy>=2,<3",
]

[project.optional-dependencies]
models = ["sentence-transformers>=5.1,<6", "huggingface-hub>=0.34,<1", "torch>=2.6,<3"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
postgres-test = ["pgserver==0.1.4"]

[project.scripts]
rag = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: 需要 TEST_DATABASE_URL 指向独立测试数据库"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
